<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Sova Security — evidence, policy, decision gates</title>
<desc id="description">Architecture illustration: reports are collected, scoped evidence is verified, policy is evaluated, and a decision is returned. Approval and execution remain with the integrating platform.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf2ff"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#426ff0"/><stop offset="1" stop-color="#3459cf"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#23416e" flood-opacity=".06"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#8da9ed" stroke-width="1.5"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1520" cy="0" r="330" fill="#e5ecff" opacity=".55"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<rect x="66" y="60" width="66" height="66" rx="19" fill="url(#blue)"/>
<path d="M99 75 118 83v15c0 13-9 23-19 28-10-5-19-15-19-28V83Z" fill="none" stroke="white" stroke-width="3"/>
<path d="m89 98 7 7 13-15" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="151" y="109" font-size="48" font-weight="750" fill="#1d335a">Sova Security<tspan fill="#426ff0">.</tspan></text>
<rect x="1110" y="76" width="423" height="39" rx="19" fill="white" stroke="#dae3f6"/>
<text x="1321" y="102" text-anchor="middle" fill="#6c80a2" font-size="16">PYTHON PACKAGE · REVIEW SERVICE</text>
<text x="67" y="200" font-size="49" font-weight="720" fill="#223a61" letter-spacing="-1">Evidence before execution.</text>
<text x="69" y="240" font-size="22" fill="#8192ae">Scoped inputs. Independent checks. Explicit decision boundaries.</text>
<rect x="64" y="289" width="1472" height="420" rx="24" fill="white" stroke="#dfe7f5" filter="url(#shadow)"/>
<rect x="459" y="315" width="1054" height="325" rx="17" fill="#f6f9ff" stroke="#e1e8f7" stroke-dasharray="6 6"/>
<text x="104" y="343" font-size="14" font-weight="650" fill="#95a4ba" letter-spacing="2">INPUT ADAPTERS</text>
<text x="485" y="343" font-size="14" font-weight="650" fill="#8199c4" letter-spacing="2">SOVA SECURITY · DECISION BOUNDARY</text>
<g fill="none" stroke="#a3b9ea" stroke-width="2" marker-end="url(#arrow)"><path d="M398 477h72"/><path d="M778 477h72"/><path d="M1158 477h72"/></g>
<rect x="104" y="382" width="280" height="197" rx="15" fill="#fff" stroke="#dae4f4"/>
<text x="126" y="416" font-size="12" fill="#8da0be" letter-spacing="2">01 / COLLECT</text>
<text x="126" y="458" font-size="26" font-weight="680" fill="#2c456c">Report adapters</text>
<text x="126" y="499" font-size="17" fill="#8295b2">Trivy · Prowler</text><text x="126" y="530" font-size="17" fill="#8295b2">ControlRun · signed inputs</text>
<rect x="484" y="382" width="280" height="197" rx="15" fill="#fff" stroke="#d8e3f7"/>
<text x="506" y="416" font-size="12" fill="#7a99d4" letter-spacing="2">02 / VERIFY</text>
<text x="506" y="458" font-size="26" font-weight="680" fill="#2c456c">Evidence checks</text>
<text x="506" y="499" font-size="17" fill="#8295b2">Signature · tenant scope</text><text x="506" y="530" font-size="17" fill="#8295b2">Expiry · revision · issuer</text>
<rect x="864" y="382" width="280" height="197" rx="15" fill="#fff" stroke="#d8e3f7"/>
<text x="886" y="416" font-size="12" fill="#7a99d4" letter-spacing="2">03 / EVALUATE</text>
<text x="886" y="458" font-size="26" font-weight="680" fill="#2c456c">Policy evaluation</text>
<text x="886" y="499" font-size="17" fill="#8295b2">Protection parity</text><text x="886" y="530" font-size="17" fill="#8295b2">OPA · deterministic rules</text>
<rect x="1244" y="382" width="252" height="197" rx="15" fill="#edf3ff" stroke="#cbdaf7"/>
<text x="1265" y="416" font-size="12" fill="#6f91ce" letter-spacing="2">04 / DECIDE</text>
<text x="1265" y="458" font-size="26" font-weight="680" fill="#2c456c">Decision gates</text>
<rect x="1265" y="480" width="66" height="28" rx="7" fill="#dfefe9"/><text x="1298" y="499" text-anchor="middle" font-size="12" font-weight="650" fill="#498775">PASS</text>
<rect x="1339" y="480" width="72" height="28" rx="7" fill="#f7e5ed"/><text x="1375" y="499" text-anchor="middle" font-size="12" font-weight="650" fill="#b56e8e">BLOCK</text>
<text x="1265" y="541" font-size="15" fill="#7c8eac">UNKNOWN → hold</text>
<text x="104" y="672" font-size="17" fill="#8b9bb3">Report → authenticated evidence → policy → decision. A decision does not grant execution authority.</text>
<g fill="#fff" stroke="#dce5f5"><rect x="67" y="754" width="455" height="57" rx="12"/><rect x="572" y="754" width="455" height="57" rx="12"/><rect x="1078" y="754" width="455" height="57" rx="12"/></g>
<g font-size="19" font-weight="580" fill="#657fAA"><text x="294" y="790" text-anchor="middle">Signed evidence</text><text x="799" y="790" text-anchor="middle">Tenant isolation</text><text x="1305" y="790" text-anchor="middle">Policy gates</text></g>
<text x="800" y="861" text-anchor="middle" font-size="17" fill="#899bb7">Approval and execution stay with the integrating platform.</text>
</g></svg>
