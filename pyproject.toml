[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sova-security"
version = "0.11.0"
description = "Revision-bound security assessment, evidence and governance for Team Bravo"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
intelligence = ["jsonschema>=4.26,<5", "rfc3339-validator>=0.1.4,<0.2"]
team = ["jsonschema>=4.26,<5", "rfc3339-validator>=0.1.4,<0.2"]
postgres = ["psycopg[binary]>=3.2,<4"]
signing = ["cryptography>=46,<51"]
aws = ["boto3>=1.35,<2"]
service = ["uvicorn>=0.35,<1", "psycopg[binary]>=3.2,<4", "cryptography>=46,<51"]
platform-test = ["fastapi>=0.115,<1", "httpx>=0.27,<1"]
dev = ["pip==26.2.2", "setuptools>=77", "jsonschema>=4.26,<5", "rfc3339-validator>=0.1.4,<0.2", "pytest>=8,<10", "ruff>=0.14,<0.18", "psycopg[binary]>=3.2,<4", "cryptography>=46,<51", "boto3>=1.35,<2", "uvicorn>=0.35,<1"]

[project.scripts]
sova-security-review = "sova_security.interfaces.review_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sova_security.adapters" = ["sql/*.sql"]
"sova_security" = ["policies/*.rego", "policies/*.json", "policies/*.txt", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["postgres: requires explicitly isolated PostgreSQL test database", "policy_engine: requires explicitly pinned OPA binary", "kubernetes_api: requires pinned local API/etcd binaries, never an existing cluster"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
